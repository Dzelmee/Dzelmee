name: Converter GIF original em SVG
on:
  push:
    branches: [main]
    paths:
      - 'tools/gif_to_svg.py'
      - '.github/workflows/convert-duelist.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - run: python tools/gif_to_svg.py
      - name: Atualizar somente o SVG convertido
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/code-duelist-original.svg
          if ! git diff --cached --quiet; then
            git commit -m "design: converto os quadros originais do GIF para SVG animado"
            git push
          fi
