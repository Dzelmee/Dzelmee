<pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="15" cy="15" r="1" fill="#cba05c" opacity=".11"/></pattern>
<style>
@keyframes drawA{0%,8%{transform:translate(190px,100px) rotate(0deg);opacity:0}22%,78%{transform:translate(0,0) rotate(-14deg);opacity:1}92%,100%{transform:translate(190px,100px) rotate(0deg);opacity:0}}
@keyframes drawB{0%,14%{transform:translate(160px,110px) scale(.7);opacity:0}28%,84%{transform:translate(0,0) scale(1);opacity:1}96%,100%{transform:translate(160px,110px) scale(.7);opacity:0}}
@keyframes drawC{0%,22%{transform:translate(90px,100px) rotate(0deg);opacity:0}36%,87%{transform:translate(0,0) rotate(13deg);opacity:1}100%{transform:translate(90px,100px) rotate(0deg);opacity:0}}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes bar{0%,100%{transform:scaleY(.25)}35%{transform:scaleY(.95)}70%{transform:scaleY(.5)}}
@keyframes gleam{0%,65%{opacity:0}78%{opacity:.65}100%{opacity:0}}
.a{animation:drawA 7s ease-in-out infinite;transform-origin:750px 230px}.b{animation:drawB 7s ease-in-out infinite;transform-origin:780px 240px}.c{animation:drawC 7s ease-in-out infinite;transform-origin:820px 230px}.pulse{animation:pulse 1.6s ease-in-out infinite}.bar{animation:bar 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}.glow{animation:gleam 7s ease-in-out infinite}
</style></defs>
