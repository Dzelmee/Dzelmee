<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-label="Jonas Dzelme Code Pulse developer banner">
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#080c18"/><stop offset="1" stop-color="#14102b"/></linearGradient>
 <linearGradient id="pulse" x1="0" x2="1"><stop stop-color="#38bdf8"/><stop offset=".52" stop-color="#a78bfa"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#64748b" stroke-opacity=".12"/></pattern>
 <style>
 .dash{stroke-dasharray:14 16;animation:flow 3s linear infinite}.beat{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 5s ease-in-out infinite}.cursor{animation:blink 1s steps(1) infinite}.float{animation:rise 4s ease-in-out infinite}.float2{animation:rise 4.7s ease-in-out infinite reverse}.dot{animation:twinkle 2s ease-in-out infinite alternate}.fade{animation:appear 6s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-60}}@keyframes draw{0%{stroke-dashoffset:1200;opacity:.25}35%,75%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:-1200;opacity:.2}}@keyframes blink{50%{opacity:0}}@keyframes rise{50%{transform:translateY(-7px)}}@keyframes twinkle{to{opacity:.25}}@keyframes appear{0%,10%{opacity:.2}35%,85%{opacity:1}100%{opacity:.2}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
 </style>
</defs>
<rect width="900" height="320" rx="18" fill="url(#bg)"/><rect width="900" height="320" rx="18" fill="url(#grid)"/>
<rect x="1" y="1" width="898" height="318" rx="17" fill="none" stroke="#8b5cf6" stroke-opacity=".4"/>
<circle cx="32" cy="27" r="5" fill="#fb7185"/><circle cx="50" cy="27" r="5" fill="#fbbf24"/><circle cx="68" cy="27" r="5" fill="#34d399"/>
<text x="450" y="31" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="12">~/Dzelmee/code-pulse.tsx</text>
<path d="M20 47H880" stroke="#334155"/>
<g class="float"><text x="45" y="92" fill="#38bdf8" font-family="monospace" font-size="15">&lt;developer&gt;</text>
<text x="45" y="132" fill="#f8fafc" font-family="Arial,sans-serif" font-weight="bold" font-size="36">JONAS DZELME</text>
<text x="47" y="162" fill="#c4b5fd" font-family="monospace" font-size="15">FULL STACK • FRONT-END • CREATIVE BUILDER</text>
<text x="46" y="194" fill="#94a3b8" font-family="monospace" font-size="13">const mission = "Build. Learn. Improve.";</text>
<text x="45" y="225" fill="#38bdf8" font-family="monospace" font-size="15">&lt;/developer&gt;<tspan class="cursor" fill="#a78bfa"> ▌</tspan></text></g>
<g class="float2"><rect x="610" y="74" width="240" height="163" rx="12" fill="#0f172a" stroke="#475569" stroke-opacity=".65"/><text x="628" y="99" fill="#94a3b8" font-family="monospace" font-size="11">SYSTEM / LIVE SIGNAL</text>
<path d="M628 160H832" stroke="#334155" stroke-dasharray="3 6"/><path class="beat" d="M628 160H660L674 146L690 184L708 123L724 171L740 150L753 160H832" fill="none" stroke="url(#pulse)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
<circle class="dot" cx="815" cy="95" r="4" fill="#34d399"/><text x="628" y="217" fill="#2dd4bf" font-family="monospace" font-size="11">● BUILD STATUS: ACTIVE</text></g>
<path class="dash" d="M40 270H860" fill="none" stroke="url(#pulse)" stroke-width="2"/>
<g font-family="monospace" font-size="13" class="fade"><text x="45" y="297" fill="#e2e8f0">REACT</text><text x="166" y="297" fill="#e2e8f0">TYPESCRIPT</text><text x="337" y="297" fill="#e2e8f0">NODE.JS</text><text x="475" y="297" fill="#e2e8f0">POSTGRESQL</text><text x="655" y="297" fill="#e2e8f0">GIT / API</text></g>
</svg>